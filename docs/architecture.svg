<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Sealed Test Room: how a run is built</title>
  <desc id="d">The scientist uses the web app on a Vultr VX1 host. The host opens a download room with open network and no study data, then a sealed room that can reach only the Vultr inference endpoint. The agent loop on the host talks to the endpoint. The sealed room makes one result-check call through its one door. A receipt is written and the rooms are destroyed.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <rect x="20" y="20" width="860" height="330" rx="10" fill="#f6f7f9" stroke="#9aa3ad"/>
  <text x="36" y="46" font-size="14" font-weight="700" fill="#1f2933">Vultr VX1 host (New York): web app, orchestrator, Microsandbox</text>

  <rect x="40" y="64" width="190" height="86" rx="8" fill="#ffffff" stroke="#52606d"/>
  <text x="135" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Web app + orchestrator</text>
  <text x="135" y="114" text-anchor="middle" font-size="12" fill="#52606d">intake, live run, receipt</text>
  <text x="135" y="132" text-anchor="middle" font-size="12" fill="#52606d">agent loop runs here</text>

  <rect x="290" y="64" width="190" height="86" rx="8" fill="#fff8e6" stroke="#b7791f"/>
  <text x="385" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Download room</text>
  <text x="385" y="114" text-anchor="middle" font-size="12" fill="#52606d">open network, NO study data</text>
  <text x="385" y="132" text-anchor="middle" font-size="12" fill="#52606d">fetches the tool, then destroyed</text>

  <rect x="290" y="214" width="190" height="104" rx="8" fill="#e8f5ec" stroke="#2f855a" stroke-width="2"/>
  <text x="385" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Sealed room</text>
  <text x="385" y="264" text-anchor="middle" font-size="12" fill="#52606d">no network except one IP:443</text>
  <text x="385" y="282" text-anchor="middle" font-size="12" fill="#52606d">wall check first, then data in</text>
  <text x="385" y="300" text-anchor="middle" font-size="12" fill="#52606d">destroyed and proven absent</text>

  <rect x="660" y="214" width="200" height="104" rx="8" fill="#ffffff" stroke="#52606d"/>
  <text x="760" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Receipt (HTML + JSON)</text>
  <text x="760" y="264" text-anchor="middle" font-size="12" fill="#52606d">connection table, hashes,</text>
  <text x="760" y="282" text-anchor="middle" font-size="12" fill="#52606d">exact code, calls through the door,</text>
  <text x="760" y="300" text-anchor="middle" font-size="12" fill="#52606d">destroy check</text>

  <rect x="620" y="64" width="240" height="86" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="740" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Vultr Serverless Inference</text>
  <text x="740" y="114" text-anchor="middle" font-size="12" fill="#52606d">api.vultrinference.com:443</text>
  <text x="740" y="132" text-anchor="middle" font-size="12" fill="#52606d">the one host the room may reach</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
  <line x1="230" y1="107" x2="288" y2="107" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="259" y="98" text-anchor="middle" font-size="11" fill="#52606d">1</text>
  <line x1="135" y1="150" x2="135" y2="266" stroke="#52606d" stroke-width="2"/>
  <line x1="135" y1="266" x2="288" y2="266" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="214" font-size="11" fill="#52606d">2: wheels, study file (after the wall check)</text>
  <line x1="230" y1="90" x2="618" y2="90" stroke="#52606d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="430" y="84" text-anchor="middle" font-size="11" fill="#52606d">3: agent loop (host holds the key)</text>
  <line x1="480" y1="250" x2="740" y2="152" stroke="#2f855a" stroke-width="3" marker-end="url(#a)"/>
  <text x="640" y="196" font-size="12" font-weight="700" fill="#2f855a">4: the one door, used once</text>
  <line x1="480" y1="290" x2="658" y2="290" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="569" y="282" text-anchor="middle" font-size="11" fill="#52606d">5</text>

  <text x="36" y="378" font-size="12" fill="#1f2933">Everything else from the sealed room (package index, Git host, any other address) is refused, and the wall check shows it before any data enters.</text>
  <text x="36" y="398" font-size="12" fill="#1f2933">The key reaches the room only on the standard input of the one command that makes step 4. Study data never enters a room with internet access.</text>
</svg>
